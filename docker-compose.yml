version: "3.9"

# ─────────────────────────────────────────────────────────
# Futebol Elite — Docker Compose
#
# Serviços:
#   db         → PostgreSQL 16
#   api        → FastAPI (porta 8000)
#   dashboard  → Streamlit (porta 8501)
#   bot        → Worker automático de análise
#
# Uso rápido:
#   docker compose up --build
#   docker compose up -d            # background
#   docker compose logs -f bot      # acompanhar worker
# ─────────────────────────────────────────────────────────

services:

  # ── Banco de Dados ────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: futebol_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: futebol
      POSTGRES_PASSWORD: futebol123
      POSTGRES_DB: futebol_elite
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futebol -d futebol_elite"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API REST ─────────────────────────────────────────
  api:
    build: .
    container_name: futebol_api
    restart: unless-stopped
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      DATABASE_URL: postgresql://futebol:futebol123@db:5432/futebol_elite
      API_FUTEBOL_KEY: ${API_FUTEBOL_KEY:-}
      FOOTBALL_DATA_KEY: ${FOOTBALL_DATA_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # ── Dashboard ─────────────────────────────────────────
  dashboard:
    build: .
    container_name: futebol_dashboard
    restart: unless-stopped
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      DATABASE_URL: postgresql://futebol:futebol123@db:5432/futebol_elite
      API_FUTEBOL_KEY: ${API_FUTEBOL_KEY:-}
      FOOTBALL_DATA_KEY: ${FOOTBALL_DATA_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./data:/app/data

  # ── Bot/Worker ────────────────────────────────────────
  bot:
    build: .
    container_name: futebol_bot
    restart: unless-stopped
    command: python bot/scheduler.py
    environment:
      DATABASE_URL: postgresql://futebol:futebol123@db:5432/futebol_elite
      API_FUTEBOL_KEY: ${API_FUTEBOL_KEY:-}
      FOOTBALL_DATA_KEY: ${FOOTBALL_DATA_KEY:-}
    depends_on:
      - api
    volumes:
      - ./data:/app/data

volumes:
  pg_data:
